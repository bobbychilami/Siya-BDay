<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG card</title>
<style>
  @font-face { font-family: "Pinyon Script"; src: url("/fonts/pinyon-400.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Cormorant Garamond"; src: url("/fonts/cormorant-300.woff2") format("woff2"); font-weight: 300; font-display: block; }
  @font-face { font-family: "Cormorant Garamond"; src: url("/fonts/cormorant-500.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "DM Sans"; src: url("/fonts/dmsans-400.woff2") format("woff2"); font-display: block; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "DM Sans", sans-serif; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    display: grid;
    place-content: center;
    justify-items: center;
    text-align: center;
    padding: 0 90px;
    background:
      radial-gradient(ellipse 70% 55% at 50% -6%, rgba(216, 183, 123, 0.26), transparent 62%),
      radial-gradient(ellipse 85% 60% at 50% 112%, rgba(126, 40, 58, 0.55), transparent 72%),
      linear-gradient(158deg, #5a1728 0%, #45101f 48%, #330a16 100%);
  }

  .frame { position: absolute; inset: 26px; border: 1px solid rgba(216, 183, 123, 0.42); }
  .frame::after { content: ""; position: absolute; inset: 9px; border: 1px solid rgba(216, 183, 123, 0.2); }

  .eyebrow {
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(240, 220, 180, 0.82);
    padding-left: 0.42em;
  }

  .name {
    font-family: "Pinyon Script", cursive;
    font-size: 178px;
    line-height: 1.08;
    color: #f4d7b4;
    margin: 6px 0 0;
    text-shadow: 0 4px 28px rgba(0, 0, 0, 0.28);
  }

  .occasion {
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: 27px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #e9c894;
    margin-top: 30px;
    padding-left: 0.4em;
  }

  .rule {
    width: 300px;
    height: 1px;
    margin: 30px 0 26px;
    background: linear-gradient(90deg, transparent, rgba(216, 183, 123, 0.9), transparent);
  }

  .when {
    font-family: "Cormorant Garamond", serif;
    font-weight: 300;
    font-size: 40px;
    letter-spacing: 0.06em;
    color: #f8e8d2;
  }

  .meta {
    margin-top: 16px;
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(240, 220, 180, 0.85);
    padding-left: 0.26em;
  }

  .hosts {
    margin-top: 22px;
    font-family: "Cormorant Garamond", serif;
    font-size: 21px;
    letter-spacing: 0.12em;
    color: rgba(244, 225, 223, 0.7);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="frame"></span>
    <p class="eyebrow">A Little Star Is Turning One</p>
    <h1 class="name">Siya</h1>
    <p class="occasion">First Birthday</p>
    <span class="rule"></span>
    <p class="when">Sunday, 22 November 2026</p>
    <p class="meta">6:30 PM &nbsp;·&nbsp; Hotel Raviraj, Gadhinglaj</p>
    <p class="hosts">Hosted by Bobby &amp; Snehal Chilami</p>
  </div>
</body>
</html>
