<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>App icon</title>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("../fonts/cormorant-500.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 180px;
        height: 180px;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 74% 20%, rgba(184, 217, 229, 0.85), transparent 62%),
          radial-gradient(circle at 18% 92%, rgba(242, 216, 216, 0.85), transparent 66%),
          linear-gradient(158deg, #fff9f0 0%, #fdf3ec 52%, #f7eae7 100%);
      }

      .ring {
        position: absolute;
        inset: 16px;
        border-radius: 50%;
        border: 1px solid rgba(185, 154, 107, 0.55);
        background:
          radial-gradient(circle at 50% 32%, rgba(255, 255, 255, 0.9), transparent 62%),
          linear-gradient(180deg, rgba(255, 249, 240, 0.55), rgba(242, 216, 216, 0.35));
      }

      .ring::after {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        border: 1px solid rgba(185, 154, 107, 0.28);
      }

      .s {
        position: relative;
        margin-top: -4px;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 500;
        font-size: 112px;
        line-height: 1;
        letter-spacing: 0.01em;
        color: #3e6b78;
        text-shadow: 0 2px 6px rgba(63, 107, 124, 0.14);
      }

      .dot {
        position: absolute;
        left: 50%;
        bottom: 34px;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        border-radius: 50%;
        background: #f2d47b;
        box-shadow: 0 0 0 1px rgba(185, 154, 107, 0.45);
      }
    </style>
  </head>
  <body>
    <span class="ring" aria-hidden="true"></span>
    <span class="s" aria-hidden="true">S</span>
    <span class="dot" aria-hidden="true"></span>
  </body>
</html>
