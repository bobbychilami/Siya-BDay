<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Coast art preview</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #efe6ef; font-family: Georgia, serif; color: #4c4654; }
  h2 { font-weight: 500; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; margin: 22px 18px 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; padding: 0 18px 40px; }
  .card { background: #fff9f0; box-shadow: 0 18px 40px -30px #4c4654; padding: 10px; }
  .card svg { width: 100%; height: auto; display: block; }
  .wide { grid-column: 1 / -1; }
  .flora { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 0 18px 40px; }
  .flora .card { display: grid; place-items: center; }
  .flora svg { width: 100%; max-height: 200px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { SPRITE } from "/src/js/coast.generated.js";
  document.body.insertAdjacentHTML("afterbegin", SPRITE);
  const section = (title, body, cls = "") => `<h2>${title}</h2><div class="grid ${cls}">${body}</div>`;
  document.getElementById("root").innerHTML = `
    ${section("Envelope coast scene", `<div class="card"><svg viewBox="0 0 400 552"><use href="#coast-scene"/></svg></div>`)}
    ${section("Venue garden", `<div class="card wide"><svg viewBox="0 0 600 420"><use href="#venue-scene"/></svg></div>`)}
    ${section("Closing garden", `<div class="card"><svg viewBox="0 0 400 640"><use href="#garden-scene"/></svg></div>`)}
  `;
  const flora = ["olive-spray","rose-spray","bougainvillea","lemon-spray","white-blooms","corner-flora","corner-flora-r","corner-leaf","flourish","butterfly-blush","butterfly-sea","butterfly-lemon"];
  document.getElementById("root").insertAdjacentHTML("beforeend", section("Flora", flora.map(id => `<div class="card"><svg viewBox="0 0 ${id === "flourish" ? "260 30" : id.startsWith("butterfly") ? "120 116" : id.startsWith("corner") ? "200 220" : "200 220"}"><use href="#${id}"/></svg><small>${id}</small></div>`).join("")));
</script>
</body>
</html>
